[project]
name = "podcast-digest"
version = "0.1.0"
description = "Fetch podcast episodes, transcribe locally, summarize with Claude, write Obsidian notes + weekly digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Apple Silicon: Whisper on the Mac GPU via MLX (needs `brew install ffmpeg`).
mac = ["mlx-whisper>=0.4"]
# Any platform: CTranslate2 Whisper (CPU, or NVIDIA GPU).
local = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
podcast-digest = "podcast_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_digest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
