[project]
name = "podcast-digest"
version = "0.1.0"
description = "Fetch podcast episodes, transcribe locally, summarize with Claude, write Obsidian notes + weekly digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
deepgram = ["deepgram-sdk>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
podcast-digest = "podcast_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_digest"]

[tool.ruff]
line-length = 100
