# Copy to config.yaml (git-ignored) and edit.
# Relative paths are inside the project folder (next to this file).
output_dir: ./notes     # <Podcast>/<date> <title>.md, Transcripts/, Digests/ (or your vault path)
data_dir: ./data        # audio, transcripts, Whisper models, SQLite state, logs

# Used by `podcast-digest run` (new episodes since last run) and `podcast-digest list`.
feeds:
  - name: The Tim Ferriss Show
    url: https://rss.art19.com/tim-ferriss-show
    # since: 2026-09-01     # ignore older episodes (default: first run takes only the latest)
    # max_new_per_run: 3

# The first interest gets the deepest treatment in every summary.
interests:
  - Building a solo AI agent security consulting practice
  # - Health and longevity
  # - Investing

transcription:
  engine: auto               # auto | mlx-whisper | faster-whisper | deepgram
  fallback: deepgram         # used if the primary engine fails (needs DEEPGRAM_API_KEY)
  prefer_published: true     # use <podcast:transcript> from the feed when it has timestamps
  keep_audio: true           # false: delete downloaded MP3s once transcribed (saves disk)
  allow_untimed_published: false
  # language: en
  # mlx_model: mlx-community/whisper-large-v3-turbo
  # faster_whisper_model: large-v3-turbo
  # deepgram_model: nova-3
  # deepgram_usd_per_minute: 0.0043

summarization:
  # claude-code: runs `claude -p` on your Claude subscription (no API key needed)
  # api:         Claude API, pay per token (needs ANTHROPIC_API_KEY)
  backend: claude-code
  claude_code_model: sonnet  # sonnet | opus | haiku
  model: claude-sonnet-5     # used by backend: api
  # digest_model: claude-opus-5
  effort: medium             # low | medium | high | xhigh | max
  max_chunk_tokens: 80000    # longer transcripts are summarized in parts, then merged
  # max_output_tokens: 16000
  # max_retries: 5
  # prices:                  # USD per 1M tokens, for the cost log
  #   claude-sonnet-5: {input: 2.0, output: 10.0}

output:
  wikilink_resources: true   # [[Book]] links for books/tools/apps
  write_transcript_notes: true
  tags: [podcast]

# Secrets come from environment variables, never this file:
#   ANTHROPIC_API_KEY (or `ant auth login`), DEEPGRAM_API_KEY
